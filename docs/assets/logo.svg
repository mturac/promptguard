  </g>
  <text x="368" y="174" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="78" font-weight="800" letter-spacing="0">PromptGuard</text>
  <text x="374" y="232" fill="#93c5fd" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="600">contract audits before agents act</text>
